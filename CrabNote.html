<style>
/* Layout: arbre de pages à gauche, éditeur de blocs centré à droite, sans cartes. */
:root{
  --bg:#F5F6F3; --panel:#ECEEEA; --ink:#1B201D; --muted:#5F6862; --faint:#9AA29C;
  --line:#D9DDD6; --accent:#1F6F5C; --accent-ink:#FFFFFF; --code:#E7EAE4; --danger:#B3402F;
  --hover:rgba(27,32,29,.06);
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --panel:#181D1A; --ink:#E6EAE7; --muted:#97A19B; --faint:#66706A;
    --line:#272E2A; --accent:#6CCBB0; --accent-ink:#0C1210; --code:#1C2320; --danger:#E07A66;
    --hover:rgba(230,234,231,.07); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --panel:#181D1A; --ink:#E6EAE7; --muted:#97A19B; --faint:#66706A;
  --line:#272E2A; --accent:#6CCBB0; --accent-ink:#0C1210; --code:#1C2320; --danger:#E07A66;
  --hover:rgba(230,234,231,.07); color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.tx:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-columns:276px minmax(0,1fr);height:100%}

/* Barre latérale */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:12px}
.brand{display:flex;align-items:baseline;justify-content:space-between;padding:20px 4px 10px}
.brand b{font:700 22px/1 var(--display);letter-spacing:-.02em}
.brand span{font-size:12px;color:var(--muted)}
.search{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--ink);font:inherit;font-size:14px;margin-bottom:10px}
.search::placeholder{color:var(--faint)}
.tree{flex:1;overflow:auto;min-height:0;margin-right:-6px;padding-right:6px}
.tr{display:flex;align-items:center;gap:2px;border-radius:6px;min-height:32px;padding-right:2px}
.tr:hover{background:var(--hover)}
.tr.on{background:var(--hover)}
.tr.on .tn{font-weight:600}
.chev{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);border-radius:4px;flex:none}
.chev svg{transition:transform .12s}
.chev.open svg{transform:rotate(90deg)}
.chev:disabled{visibility:hidden}
.tn{flex:1;min-width:0;text-align:left;padding:5px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ta{opacity:0;width:24px;height:24px;border-radius:4px;color:var(--muted);font-size:16px;line-height:1;flex:none}
.ta:hover{background:var(--hover);color:var(--ink)}
.tr:hover .ta,.tr.on .ta,.ta:focus-visible,.ta.armed{opacity:1}
.ta.armed{width:auto;padding:0 8px;font-size:12px;color:var(--danger);font-weight:600}
@media (hover:none){.ta{opacity:1}}
.res{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:6px}
.res:hover{background:var(--hover)}
.res b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.none{color:var(--muted);font-size:13.5px;padding:8px}
.newp{display:flex;align-items:center;gap:8px;padding:12px 6px;margin-top:6px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:left}
.newp:hover{color:var(--ink)}
.newp i{font-style:normal;width:20px;height:20px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px;line-height:1}
.hint{font-size:12px;color:var(--faint);padding:0 6px 14px}

/* Zone principale */
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.top{display:flex;align-items:center;gap:10px;height:46px;flex:none;border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#menuBtn{display:none;width:32px;height:32px;border-radius:6px;align-items:center;justify-content:center;margin-left:-6px;color:var(--muted)}
#menuBtn:hover{background:var(--hover)}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;font-size:13.5px;color:var(--muted)}
.crumbs button{color:var(--muted);max-width:14ch;overflow:hidden;text-overflow:ellipsis}
.crumbs button:hover{color:var(--ink);text-decoration:underline}
.crumbs .cur{color:var(--ink);overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumbs .sep{color:var(--faint)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex:none}
.status i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.status.saving i{background:var(--faint)}
.status.error i{background:var(--danger)}
.scroll{flex:1;overflow:auto;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.doc{max-width:740px;margin:0 auto;padding-block:44px 38vh;padding-left:30px}
#title{font:700 40px/1.15 var(--display);letter-spacing:-.025em;outline:none;margin:0 0 22px;padding:2px 0;text-wrap:balance;word-break:break-word;white-space:pre-wrap}
#title:empty::before{content:"Sans titre";color:var(--faint)}

/* Blocs */
.blk{position:relative;display:flex;align-items:flex-start;padding-left:calc(var(--i,0)*26px);margin:1px 0}
.gut{position:absolute;left:-54px;top:2px;width:50px;display:flex;justify-content:flex-end;opacity:0;transition:opacity .1s}
.blk:hover .gut,.blk:focus-within .gut{opacity:1}
.gb{width:24px;height:24px;border-radius:4px;color:var(--faint);font-size:15px;line-height:1}
.gb:hover{background:var(--hover);color:var(--ink)}
@media (hover:none),(max-width:880px){.gut{display:none}.doc{padding-left:0}}
.tx{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;padding:3px 0}
.tx:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.t-p .tx:empty:not(:focus)::before{content:""}
.mk{width:26px;flex:none;text-align:center;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums;user-select:none}
.t-ol .mk{text-align:left;padding-left:2px}
.cb{width:18px;height:18px;margin:7px 8px 0 2px;border:1.5px solid var(--faint);border-radius:4px;flex:none;display:grid;place-items:center;color:transparent}
.cb:hover{border-color:var(--accent)}
.t-todo.done .cb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.t-todo.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.t-h1 .tx{font:700 30px/1.25 var(--display);letter-spacing:-.02em;margin-top:22px}
.t-h2 .tx{font:650 23px/1.3 var(--display);letter-spacing:-.015em;margin-top:16px}
.t-h3 .tx{font:600 18px/1.35 var(--display);margin-top:10px}
.t-quote .tx{border-left:3px solid var(--accent);padding:2px 0 2px 14px;color:var(--muted);font-size:16px;margin:4px 0}
.t-callout .tx{background:color-mix(in srgb,var(--accent) 11%,var(--bg));border-radius:6px;padding:10px 14px;margin:6px 0}
.t-code .tx{font:13px/1.65 var(--mono);background:var(--code);border-radius:6px;padding:12px 14px;margin:6px 0;white-space:pre;overflow-x:auto;word-break:normal}
.t-hr hr{flex:1;border:0;border-top:1px solid var(--line);margin:14px 0}
.pl{display:flex;align-items:center;gap:8px;padding:5px 8px;margin:2px 0;border-radius:6px;text-align:left;font-weight:500;min-width:0;flex:1}
.pl:hover:not(:disabled){background:var(--hover)}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--line)}
.pl:disabled{color:var(--faint);cursor:default}
.pl svg{flex:none;color:var(--accent)}
.tail{display:block;width:100%;text-align:left;color:var(--faint);padding:10px 4px;margin-top:6px;font-size:14px}
.tail:hover{color:var(--muted)}
.meta{color:var(--faint);font-size:12.5px;margin-top:20px;font-variant-numeric:tabular-nums}

/* Menus */
.menu{position:fixed;z-index:50;width:272px;max-height:330px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px}
.mi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:5px;font-size:14px}
.mi small{color:var(--faint);font-family:var(--mono);font-size:11.5px}
.mi.sel,.mi:hover{background:var(--hover)}
.mi.danger{color:var(--danger)}
.veil{display:none}
@media (max-width:880px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(86vw,320px);transform:translateX(-102%);transition:transform .18s;padding-top:env(safe-area-inset-top,0px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .veil.open{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35)}
  #menuBtn{display:flex}
  #title{font-size:32px}
  .status span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="app">

    <nav class="tree" id="tree" aria-label="Pages"></nav>
    <button class="newp" id="newRoot" type="button"><i>+</i>Nouvelle page</button>
    <div class="hint">Ctrl/Cmd + K pour rechercher</div>
  </aside>
  <div class="veil" id="veil"></div>
  <main>
    <header class="top">
      <button id="menuBtn" type="button" aria-label="Ouvrir la liste des pages">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h12M3 9h12M3 13h12"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <div class="status" id="status"><i></i><span>Chargement</span></div>
    </header>
    <div class="scroll" id="scroll">
      <div class="doc">
        <h1 id="title" contenteditable="true" spellcheck="true" role="textbox" aria-label="Titre de la page"></h1>
        <div id="blocks"></div>
        <button class="tail" id="tail" type="button">+ Ajouter un bloc</button>
        <div class="meta" id="meta"></div>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var el=function(t,c,tx){var e=document.createElement(t);if(c)e.className=c;if(tx!=null)e.textContent=tx;return e};
var uid=function(){return Math.random().toString(36).slice(2,10)||"x"+Date.now().toString(36)};
var now=function(){return Date.now()};

var LS="carnet-pages-v1",LSCUR="carnet-cur";

var SVG_CHEV='<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5L7 5L3 8.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var TYPES=[
 {t:"p",label:"Texte",hint:"",k:"texte paragraphe"},
 {t:"h1",label:"Titre 1",hint:"#",k:"titre heading h1"},
 {t:"h2",label:"Titre 2",hint:"##",k:"titre heading h2"},
 {t:"h3",label:"Titre 3",hint:"###",k:"titre heading h3"},
 {t:"ul",label:"Liste à puces",hint:"-",k:"liste puces bullet"},

 {t:"callout",label:"Encadré",hint:"",k:"encadre callout note"},

];
var PH={p:"Écris quelque chose, ou tape / pour un bloc",h1:"Titre 1",h2:"Titre 2",h3:"Titre 3",ul:"Élément de liste",ol:"Élément de liste",todo:"À faire",quote:"Citation",callout:"Note importante",code:"Code"};

function mkBlock(type,text,x){return Object.assign({id:uid(),type:type,text:text||""},x||{})}

/* ---------- Données d'exemple ---------- */
function seed(){
  var t=now(),P={};

  var b=mkBlock;
  add("accueil","Bienvenue","",0,[

    b("todo","Tape / sur une ligne vide pour choisir un type de bloc"),
    b("todo","Tape # puis espace pour un titre, - pour une liste, [] pour une case à cocher"),

  ]);

  ]);
  add("projets","Projets","accueil",1,[

  ]);
  add("refonte","Refonte du site","projets",0,[
    b("h2","Objectifs"),
    b("ul","Réduire le temps de chargement sous 2 secondes"),
    b("ul","Simplifier la navigation à 5 entrées",{}),
    b("ul","Rendre le site lisible sur téléphone"),
    b("h2","Étapes"),
    b("ol","Auditer les pages existantes"),
    b("ol","Dessiner la nouvelle arborescence"),
    b("ol","Maquetter les pages clés"),
    b("ol","Mettre en ligne par lots"),
    b("code","$ npm run build\n$ npm run deploy"),
    b("p","")
  ]);
  add("route","Feuille de route","",1,[
    b("callout","Cette version couvre les pages, les sous-pages et la prise de notes. Le reste arrive par étapes."),
    b("h2","Disponible"),
    b("todo","Pages et sous-pages imbriquées",{checked:true}),
    b("todo","Prise de notes et documents",{checked:true}),
    b("todo","Checklists",{checked:true}),
    b("todo","Titres, listes, citations, encadrés et code",{checked:true}),
    b("h2","À venir"),
    b("todo","Tableaux, listes, galeries et Kanban"),
    b("todo","Calendriers et chronologies"),
    b("todo","Filtres, tri et propriétés personnalisées"),
    b("todo","Relations entre bases, agrégations et formules"),
    b("todo","Gestion de tâches, projets et objectifs"),
    b("todo","Documentation de code et d'API"),
    b("todo","Suivi de bugs et gestion de versions"),
    b("todo","Intégrations GitHub et MCP"),
    b("p","")
  ]);
  return P;
}

/* ---------- Accès aux pages ---------- */
function children(pid){
  return Object.keys(pages).map(function(k){return pages[k]}).filter(function(p){return (p.parent||"")===pid}).sort(function(a,b){return a.pos-b.pos});
}
function nextPos(pid){var c=children(pid);return c.length?c[c.length-1].pos+1:0}
function firstRoot(){var r=children("");return r.length?r[0].id:null}
function chain(id){var out=[],g=0;while(id&&pages[id]&&g++<50){out.unshift(id);id=pages[id].parent}return out}
function blocksOf(){return pages[cur].blocks}
function findIdx(id){return blocksOf().findIndex(function(b){return b.id===id})}

/* ---------- Sauvegarde ---------- */
function loadLocal(){try{var r=JSON.parse(localStorage.getItem(LS)||"null");if(r&&Object.keys(r).length)return r}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(pages))}catch(e){}}
function setStatus(s){
  var n=$("#status");n.className="status"+(s==="saving"?" saving":s==="error"?" error":"");
  n.querySelector("span").textContent=s==="saving"?"Enregistrement…":s==="error"?"Échec de l'enregistrement":s==="local"?"Enregistré sur cet appareil":"Enregistré";
}
function touch(id){
  var p=pages[id];if(!p)return;
  p.updated=now();dirty.add(id);setStatus("saving");
  clearTimeout(saveT);saveT=setTimeout(flush,700);saveLocal();renderMeta();
}
async function flush(){
  if(flushing){saveT=setTimeout(flush,400);return}
  flushing=true;var failed=false;
  try{
    var ids=Array.from(dirty);
    for(var i=0;i<ids.length;i++){
      var id=ids[i];dirty.delete(id);var p=pages[id];if(!p||!coll)continue;
      try{await coll.doc(id).set(clone(p))}catch(e){dirty.add(id);failed=true}
    }
    var dl=Array.from(delQ);
    for(var j=0;j<dl.length;j++){
      delQ.delete(dl[j]);if(!coll)continue;
      try{await coll.doc(dl[j]).delete()}catch(e){delQ.add(dl[j]);failed=true}
    }
  }finally{flushing=false}
  if(failed){setStatus("error");clearTimeout(saveT);saveT=setTimeout(flush,5000)}
  else if(!dirty.size)setStatus(coll?"saved":"local");
}
async function initDb(){
  var db=null;
  try{if(window.claude&&window.claude.use)db=await window.claude.use("db")}catch(e){db=null}
  if(!db){setStatus("local");return}
  coll=db.collection("carnet");
  var first=true,timer=setTimeout(function(){setStatus("local")},10000);

    if(first){
      if(snap.metadata.fromCache&&snap.empty)return;
      first=false;clearTimeout(timer);
      if(snap.empty){Object.keys(pages).forEach(function(id){dirty.add(id)});flush()}
      else adopt(snap);
      return;
    }
    applyChanges(snap);
  },function(){setStatus("local")});

function adopt(snap){
  var P={};snap.docs.forEach(function(d){var v=d.data();if(v&&v.id)P[d.id]=clone(v)});

  pages=P;saveLocal();
  if(!pages[cur])cur=firstRoot();
  show(cur);setStatus("saved");

function applyChanges(snap){
  var editor=false;
  snap.docChanges().forEach(function(ch){
    var d=ch.doc;

  saveLocal();renderTree();renderCrumbs();
  var a=document.activeElement;
  if(editor&&!(a&&(a.classList.contains("tx")||a.id==="title")))renderPage();
}

/* ---------- Pages ---------- */
function newPage(parent){
  var p={id:uid(),title:"",parent:parent||"",pos:nextPos(parent||""),collapsed:false,updated:now(),blocks:[mkBlock("p")]};
  pages[p.id]=p;
  if(parent&&pages[parent]){pages[parent].collapsed=false;touch(parent)}
  touch(p.id);go(p.id);
  setTimeout(function(){$("#title").focus()},30);
}
function deletePage(id){
  var gone=[];
  (function walk(x){gone.push(x);children(x).forEach(function(c){walk(c.id)})})(id);
  var parent=pages[id]?pages[id].parent:"";
  gone.forEach(function(x){delete pages[x];delQ.add(x);dirty.delete(x)});
  delArm=null;saveLocal();
  if(gone.indexOf(cur)>-1){
    var next=(parent&&pages[parent])?parent:firstRoot();
    if(!next){var p={id:uid(),title:"",parent:"",pos:0,collapsed:false,updated:now(),blocks:[mkBlock("p")]};pages[p.id]=p;touch(p.id);next=p.id}
    show(next);
  }else renderTree();
  setStatus("saving");clearTimeout(saveT);saveT=setTimeout(flush,300);
}
function go(id){
  show(id);
  try{if(location.hash!=="#p-"+id)history.replaceState(null,"","#p-"+id)}catch(e){}
}
function show(id){
  if(!pages[id])id=firstRoot();
  cur=id;
  try{localStorage.setItem(LSCUR,id)}catch(e){}
  renderPage();renderTree();renderCrumbs();closeDrawer();
  $("#scroll").scrollTop=0;
}

/* ---------- Rendu : barre latérale ---------- */
function renderTree(){
  var host=$("#tree");host.textContent="";
  var q=$("#search").value.trim().toLowerCase();
  if(q){
    var n=0;
    Object.keys(pages).forEach(function(k){
      var p=pages[k],hit=(p.title||"").toLowerCase().indexOf(q)>-1,snip="";
      if(!hit){
        for(var i=0;i<p.blocks.length;i++){if((p.blocks[i].text||"").toLowerCase().indexOf(q)>-1){hit=true;snip=p.blocks[i].text;break}}
      }
      if(!hit)return;
      n++;
      var r=el("button","res");r.type="button";
      r.append(el("b","",p.title||"Sans titre"));
      r.append(el("small","",snip||chain(p.id).map(function(c){return pages[c].title||"Sans titre"}).join(" / ")));
      r.onclick=function(){$("#search").value="";go(p.id)};
      host.append(r);
    });
    if(!n)host.append(el("div","none","Aucune page ne correspond."));
    return;
  }
  renderLevel(children(""),0,host);
  if(!Object.keys(pages).length)host.append(el("div","none","Aucune page."));
}
function renderLevel(list,depth,host){
  list.forEach(function(p){
    var kids=children(p.id);
    var row=el("div","tr"+(p.id===cur?" on":""));
    row.style.paddingLeft=(4+depth*14)+"px";
    var chev=el("button","chev"+(p.collapsed?"":" open"));chev.type="button";
    chev.setAttribute("aria-label",p.collapsed?"Déplier":"Replier");
    chev.innerHTML=SVG_CHEV;if(!kids.length)chev.disabled=true;
    chev.onclick=function(e){e.stopPropagation();p.collapsed=!p.collapsed;touch(p.id);renderTree()};
    var name=el("button","tn",p.title||"Sans titre");name.type="button";
    name.onclick=function(){go(p.id)};
    var add=el("button","ta","+");add.type="button";add.title="Nouvelle sous-page";add.setAttribute("aria-label","Nouvelle sous-page");
    add.onclick=function(e){e.stopPropagation();newPage(p.id)};
    var del=el("button","ta",delArm===p.id?"Supprimer ?":"×");del.type="button";
    del.title="Supprimer la page et ses sous-pages";del.setAttribute("aria-label","Supprimer la page");
    if(delArm===p.id)del.className="ta armed";
    del.onclick=function(e){
      e.stopPropagation();
      if(delArm===p.id){deletePage(p.id);return}
      delArm=p.id;renderTree();
      setTimeout(function(){if(delArm===p.id){delArm=null;renderTree()}},3500);
    };
    row.append(chev,name,add,del);host.append(row);
    if(kids.length&&!p.collapsed)renderLevel(kids,depth+1,host);
  });
}
function renderCrumbs(){
  var h=$("#crumbs");h.textContent="";
  var c=chain(cur);
  c.forEach(function(id,i){
    var t=pages[id].title||"Sans titre";
    if(i<c.length-1){
      var b=el("button","",t);b.type="button";b.onclick=function(){go(id)};h.append(b,el("span","sep","/"));
    }else h.append(el("span","cur",t));
  });
}
function renderMeta(){
  var p=pages[cur];if(!p)return;
  var words=0;p.blocks.forEach(function(b){var t=(b.text||"").trim();if(t)words+=t.split(/\s+/).length});
  var n=p.blocks.length;
  $("#meta").textContent=n+(n>1?" blocs":" bloc")+" · "+words+(words>1?" mots":" mot");
}

/* ---------- Rendu : page et blocs ---------- */
function renderPage(){
  var p=pages[cur];if(!p)return;
  $("#title").textContent=p.title||"";
  renderBlocks();renderMeta();
}
function renderBlocks(){
  var host=$("#blocks");host.textContent="";
  var counters=[];
  blocksOf().forEach(function(b){
    var num=0;
    if(b.type==="ol"){var k=b.ind||0;counters[k]=(counters[k]||0)+1;counters.length=k+1;num=counters[k]}
    else counters=[];
    host.append(blockEl(b,num));
  });
}
function blockEl(b,num){
  var w=el("div","blk t-"+b.type+(b.type==="todo"&&b.checked?" done":""));
  w.dataset.id=b.id;w.style.setProperty("--i",b.ind||0);
  var g=el("div","gut");
  var plus=el("button","gb","+");plus.type="button";plus.title="Insérer un bloc dessous";plus.setAttribute("aria-label","Insérer un bloc dessous");
  plus.onmousedown=function(e){e.preventDefault()};
  plus.onclick=function(){
    var nb=mkBlock("p","/");blocksOf().splice(findIdx(b.id)+1,0,nb);touch(cur);
    renderBlocks();focusBlock(nb.id,"end");openSlash(nb.id,"");
  };
  var grip=el("button","gb","⋮");grip.type="button";grip.title="Actions du bloc";grip.setAttribute("aria-label","Actions du bloc");
  grip.onmousedown=function(e){e.preventDefault()};
  grip.onclick=function(){openMenu(grip.getBoundingClientRect(),actionItems(b.id),{})};
  g.append(plus,grip);w.append(g);

  if(b.type==="hr"){w.append(el("hr"));return w}
  if(b.type==="page"){
    var t=pages[b.ref];
    var r=el("button","pl");r.type="button";r.innerHTML=SVG_DOC;
    r.append(el("span","",t?(t.title||"Sans titre"):"Page supprimée"));
    if(t)r.onclick=function(){go(b.ref)};else r.disabled=true;
    w.append(r);return w;
  }
  if(b.type==="ul")w.append(el("span","mk","•"));
  if(b.type==="ol")w.append(el("span","mk",num+"."));
  if(b.type==="todo"){
    var cb=el("button","cb");cb.type="button";cb.innerHTML=SVG_CHECK;cb.setAttribute("aria-label","Marquer comme fait");
    cb.setAttribute("aria-pressed",b.checked?"true":"false");
    cb.onclick=function(){b.checked=!b.checked;w.classList.toggle("done",!!b.checked);cb.setAttribute("aria-pressed",b.checked?"true":"false");touch(cur)};
    w.append(cb);
  }
  var tx=el("div","tx");
  try{tx.contentEditable="plaintext-only"}catch(e){tx.contentEditable="true"}
  tx.spellcheck=true;tx.dataset.ph=PH[b.type]||"";tx.textContent=b.text;
  tx.addEventListener("input",function(){onInput(b,tx)});
  tx.addEventListener("keydown",function(e){onKey(e,b,tx)});
  tx.addEventListener("paste",function(e){onPaste(e,b,tx)});
  w.append(tx);
  return w;
}

/* ---------- Focus et curseur ---------- */
function setCaret(tx,off){
  var sel=window.getSelection(),r=document.createRange();
  var walker=document.createTreeWalker(tx,NodeFilter.SHOW_TEXT,null),node,acc=0,done=false;
  while((node=walker.nextNode())){
    var len=node.nodeValue.length;
    if(off<=acc+len){r.setStart(node,off-acc);done=true;break}
    acc+=len;
  }
  if(!done){r.selectNodeContents(tx);r.collapse(false)}else r.collapse(true);
  sel.removeAllRanges();sel.addRange(r);
}
function getCaret(tx){
  var sel=window.getSelection();if(!sel.rangeCount)return 0;
  var r=document.createRange();r.selectNodeContents(tx);
  try{r.setEnd(sel.anchorNode,sel.anchorOffset)}catch(e){return tx.textContent.length}
  return r.toString().length;
}
function focusBlock(id,where){
  var tx=document.querySelector('.blk[data-id="'+id+'"] .tx');if(!tx)return;
  tx.focus({preventScroll:false});
  var len=tx.textContent.length;
  setCaret(tx,where==="end"?len:where==="start"?0:Math.min(where,len));
}
function lineEdge(tx,up){
  var sel=window.getSelection();if(!sel.rangeCount)return true;
  var r=sel.getRangeAt(0).cloneRange();r.collapse(true);
  var rc=r.getClientRects()[0];
  if(!rc){rc=r.getBoundingClientRect();if(!rc||(rc.width===0&&rc.height===0))return true}
  var box=tx.getBoundingClientRect(),lh=parseFloat(getComputedStyle(tx).lineHeight)||24;
  return up?(rc.top-box.top<lh*0.8):(box.bottom-rc.bottom<lh*0.8);
}
function neighbor(id,dir){
  var list=blocksOf(),i=findIdx(id)+dir;
  while(i>=0&&i<list.length){if(list[i].type!=="hr"&&list[i].type!=="page")return list[i];i+=dir}
  return null;
}

/* ---------- Édition ---------- */
function onInput(b,tx){
  var t=tx.textContent.replace(/ /g," ");
  if(t==="\n")t="";
  b.text=t;touch(cur);
  if(b.type==="p"){
    for(var i=0;i<MD.length;i++){
      if(MD[i][0].test(t)){convert(b,MD[i][1]);return}
    }
  }
  if(b.type!=="code"&&/^\/\S*$/.test(t))openSlash(b.id,t.slice(1));
  else if(menu&&menu.slash)closeMenu();
}
function convert(b,type){
  b.type=type;b.text="";if(type==="todo")b.checked=false;
  if(type==="hr"){
    var i=findIdx(b.id);
    if(!blocksOf()[i+1]){blocksOf().push(mkBlock("p"))}
    touch(cur);renderBlocks();var nx=neighbor(b.id,1);if(nx)focusBlock(nx.id,"start");return;
  }
  touch(cur);renderBlocks();focusBlock(b.id,"start");
}
function applyType(id,type){
  var list=blocksOf(),i=findIdx(id),b=list[i];if(!b)return;
  if(type==="page"){
    var np={id:uid(),title:"",parent:cur,pos:nextPos(cur),collapsed:false,updated:now(),blocks:[mkBlock("p")]};
    pages[np.id]=np;pages[cur].collapsed=false;
    b.type="page";b.ref=np.id;b.text="";delete b.checked;
    if(!list[i+1])list.push(mkBlock("p"));
    touch(np.id);touch(cur);go(np.id);
    setTimeout(function(){$("#title").focus()},30);
    return;
  }
  b.type=type;b.text="";
  if(type==="todo")b.checked=false;
  if(type==="hr"){if(!list[i+1])list.push(mkBlock("p"));touch(cur);renderBlocks();var nx=neighbor(id,1);if(nx)focusBlock(nx.id,"start");return}
  touch(cur);renderBlocks();focusBlock(id,"end");
}
function onKey(e,b,tx){
  if(menu&&menu.slash){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();menuMove(e.key==="ArrowDown"?1:-1);return}
    if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();menuRun();return}
    if(e.key==="Escape"){e.preventDefault();closeMenu();return}
  }
  var sel=window.getSelection();
  if(e.altKey&&(e.key==="ArrowUp"||e.key==="ArrowDown")){
    e.preventDefault();var off=getCaret(tx);
    if(moveBlock(b.id,e.key==="ArrowUp"?-1:1)){renderBlocks();focusBlock(b.id,off)}
    return;
  }
  if(e.key==="Tab"&&LISTS.indexOf(b.type)>-1){
    e.preventDefault();var o=getCaret(tx);
    b.ind=Math.max(0,Math.min(3,(b.ind||0)+(e.shiftKey?-1:1)));
    touch(cur);renderBlocks();focusBlock(b.id,o);return;
  }
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){
    e.preventDefault();
    if(b.type==="code"){
      if(e.metaKey||e.ctrlKey){var nb=mkBlock("p");blocksOf().splice(findIdx(b.id)+1,0,nb);touch(cur);renderBlocks();focusBlock(nb.id,"start")}
      else document.execCommand("insertText",false,"\n");
      return;
    }
    var isList=LISTS.indexOf(b.type)>-1;
    if(isList&&!b.text){
      if(b.ind)b.ind--;else{b.type="p";delete b.checked}
      touch(cur);renderBlocks();focusBlock(b.id,"start");return;
    }
    var at=getCaret(tx),before=b.text.slice(0,at),after=b.text.slice(at);
    b.text=before;
    var nt=isList?b.type:"p",n2=mkBlock(nt,after);
    if(isList)n2.ind=b.ind||0;
    blocksOf().splice(findIdx(b.id)+1,0,n2);touch(cur);renderBlocks();focusBlock(n2.id,"start");return;
  }
  if(e.key==="Backspace"&&sel.isCollapsed&&getCaret(tx)===0){
    e.preventDefault();
    if(b.ind){b.ind--;touch(cur);renderBlocks();focusBlock(b.id,"start");return}
    if(b.type!=="p"){b.type="p";delete b.checked;touch(cur);renderBlocks();focusBlock(b.id,"start");return}
    var list=blocksOf(),i=findIdx(b.id);if(i<=0)return;
    var prev=list[i-1];
    if(prev.type==="hr"){list.splice(i-1,1);touch(cur);renderBlocks();focusBlock(b.id,"start");return}
    if(prev.type==="page"){if(!b.text){list.splice(i,1);touch(cur);renderBlocks()}return}
    var pl=prev.text.length;prev.text+=b.text;list.splice(i,1);touch(cur);renderBlocks();focusBlock(prev.id,pl);return;
  }
  if((e.key==="ArrowUp"||e.key==="ArrowDown")&&!e.shiftKey&&!e.altKey&&sel.isCollapsed){
    var up=e.key==="ArrowUp";
    if(lineEdge(tx,up)){
      var nb2=neighbor(b.id,up?-1:1);
      if(nb2){e.preventDefault();focusBlock(nb2.id,up?"end":"start")}
    }
  }
}
function lineToBlock(l){
  var m;
  if((m=/^[-*]\s+(.*)$/.exec(l)))return mkBlock("ul",m[1]);
  if((m=/^\[\s?\]\s+(.*)$/.exec(l)))return mkBlock("todo",m[1]);
  if((m=/^\[x\]\s+(.*)$/i.exec(l)))return mkBlock("todo",m[1],{checked:true});
  if((m=/^\d+\.\s+(.*)$/.exec(l)))return mkBlock("ol",m[1]);
  if((m=/^###\s+(.*)$/.exec(l)))return mkBlock("h3",m[1]);
  if((m=/^##\s+(.*)$/.exec(l)))return mkBlock("h2",m[1]);
  if((m=/^#\s+(.*)$/.exec(l)))return mkBlock("h1",m[1]);
  if((m=/^>\s+(.*)$/.exec(l)))return mkBlock("quote",m[1]);
  return mkBlock("p",l);
}
function onPaste(e,b,tx){
  e.preventDefault();
  var text=((e.clipboardData||window.clipboardData).getData("text/plain")||"").replace(/\r/g,"");
  if(!text)return;
  if(b.type==="code"){document.execCommand("insertText",false,text);return}
  if(text.indexOf("\n")<0){document.execCommand("insertText",false,text);return}
  var lines=text.split("\n").filter(function(l){return l.trim()!==""});
  if(!lines.length)return;
  var at=getCaret(tx),before=b.text.slice(0,at),after=b.text.slice(at);
  b.text=before+lines[0];
  var list=blocksOf(),i=findIdx(b.id),last=b;
  lines.slice(1).forEach(function(l){var nb=lineToBlock(l);list.splice(++i,0,nb);last=nb});
  var ofs=last.text.length;last.text+=after;
  touch(cur);renderBlocks();focusBlock(last.id,ofs);
}
function moveBlock(id,d){
  var list=blocksOf(),i=findIdx(id),j=i+d;
  if(i<0||j<0||j>=list.length)return false;
  var t=list[i];list[i]=list[j];list[j]=t;touch(cur);return true;
}
function actionItems(id){
  return [
    {label:"Monter",hint:"Alt ↑",run:function(){if(moveBlock(id,-1))renderBlocks()}},
    {label:"Descendre",hint:"Alt ↓",run:function(){if(moveBlock(id,1))renderBlocks()}},
    {label:"Dupliquer",hint:"",run:function(){
      var list=blocksOf(),i=findIdx(id);if(i<0)return;
      var c=clone(list[i]);c.id=uid();list.splice(i+1,0,c);touch(cur);renderBlocks();
    }},
    {label:"Supprimer",hint:"",danger:true,run:function(){
      var list=blocksOf(),i=findIdx(id);if(i<0)return;
      list.splice(i,1);if(!list.length)list.push(mkBlock("p"));touch(cur);renderBlocks();
    }}
  ];
}

/* ---------- Menus ---------- */
function openSlash(id,q){
  q=(q||"").toLowerCase();
  var items=TYPES.filter(function(x){return !q||x.label.toLowerCase().indexOf(q)>-1||x.k.indexOf(q)>-1}).map(function(x){
    return {label:x.label,hint:x.hint,run:function(){applyType(id,x.t)}};
  });
  if(!items.length){closeMenu();return}
  var tx=document.querySelector('.blk[data-id="'+id+'"] .tx');if(!tx)return;
  openMenu(tx.getBoundingClientRect(),items,{slash:true});
}
function openMenu(rect,items,opt){
  closeMenu();
  var m=el("div","menu");m.setAttribute("role","menu");
  items.forEach(function(it,i){
    var r=el("button","mi"+(it.danger?" danger":"")+(i===0?" sel":""));r.type="button";r.setAttribute("role","menuitem");
    r.append(el("span","",it.label));if(it.hint)r.append(el("small","",it.hint));
    r.onmousedown=function(e){e.preventDefault()};
    r.onclick=function(){closeMenu();it.run()};
    m.append(r);
  });
  document.body.append(m);
  var h=m.offsetHeight,w=m.offsetWidth;
  var top=rect.bottom+4;if(top+h>window.innerHeight-8)top=Math.max(8,rect.top-h-4);
  var left=Math.max(8,Math.min(rect.left,window.innerWidth-w-8));
  m.style.top=top+"px";m.style.left=left+"px";
  menu={el:m,items:items,sel:0,slash:!!opt.slash};
}
function closeMenu(){if(menu){menu.el.remove();menu=null}}
function menuMove(d){
  if(!menu)return;
  var n=menu.items.length;menu.sel=(menu.sel+d+n)%n;
  Array.prototype.forEach.call(menu.el.children,function(c,i){c.classList.toggle("sel",i===menu.sel)});
  menu.el.children[menu.sel].scrollIntoView({block:"nearest"});
}
function menuRun(){if(!menu)return;var it=menu.items[menu.sel];closeMenu();it.run()}

/* ---------- Tiroir mobile ---------- */
function closeDrawer(){$("#side").classList.remove("open");$("#veil").classList.remove("open")}

/* ---------- Événements ---------- */
$("#title").addEventListener("input",function(){
  var p=pages[cur];if(!p)return;
  p.title=this.textContent.replace(/\n/g," ");touch(cur);renderTree();renderCrumbs();
});
$("#title").addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    e.preventDefault();var l=blocksOf();
    if(!l.length){l.push(mkBlock("p"));renderBlocks()}
    var t=l.find(function(b){return b.type!=="hr"&&b.type!=="page"});
    if(t)focusBlock(t.id,"start");
  }
});
$("#tail").addEventListener("click",function(){
  var l=blocksOf(),last=l[l.length-1];
  if(last&&last.type==="p"&&!last.text){focusBlock(last.id,"start");return}
  var nb=mkBlock("p");l.push(nb);touch(cur);renderBlocks();focusBlock(nb.id,"start");
});
$("#newRoot").addEventListener("click",function(){newPage("")});
$("#search").addEventListener("input",renderTree);
$("#menuBtn").addEventListener("click",function(){$("#side").classList.add("open");$("#veil").classList.add("open")});
$("#veil").addEventListener("click",closeDrawer);
document.addEventListener("mousedown",function(e){if(menu&&!menu.el.contains(e.target))closeMenu()});
document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){
    e.preventDefault();$("#side").classList.add("open");$("#veil").classList.add("open");$("#search").focus();
  }else if(e.key==="Escape"&&menu&&!menu.slash)closeMenu();
});
window.addEventListener("hashchange",function(){
  var m=location.hash.match(/^#p-(.+)$/);
  if(m&&pages[m[1]]&&m[1]!==cur)show(m[1]);
});
window.addEventListener("pagehide",function(){saveLocal()});

/* ---------- Démarrage ---------- */
pages=loadLocal();
if(!pages){pages=seed();saveLocal()}
var m0=location.hash.match(/^#p-(.+)$/),start=m0&&m0[1];
if(!start||!pages[start]){try{start=localStorage.getItem(LSCUR)}catch(e){start=null}}
if(!start||!pages[start])start=firstRoot();
show(start);
initDb();
})();
</script>
